[main]
font=JetBrainsMono Nerd Font:size=11,Noto Color Emoji:size=11
font-bold=JetBrainsMono Nerd Font:style=Bold:size=11,Noto Color Emoji:size=11
font-italic=JetBrainsMono Nerd Font:style=Italic:size=11,Noto Color Emoji:size=11
font-bold-italic=JetBrainsMono Nerd Font:style=Bold Italic:size=11,Noto Color Emoji:size=11
line-height=18px
letter-spacing=0
pad=18x16 center
initial-window-size-chars=100x30
resize-delay-ms=80
bold-text-in-bright=yes
selection-target=clipboard

[scrollback]
lines=20000
multiplier=5.0

[cursor]
style=beam
blink=yes
beam-thickness=1.6

[mouse]
hide-when-typing=yes

[url]
osc8-underline=url-mode

[colors-dark]
alpha=0.78
blur=yes
cursor={{ surface.hex }} {{ term12.hex }}
foreground={{ onSurface.hex }}
background={{ surface.hex }}
regular0={{ term0.hex }}
regular1={{ term1.hex }}
regular2={{ term2.hex }}
regular3={{ term3.hex }}
regular4={{ term4.hex }}
regular5={{ term5.hex }}
regular6={{ term6.hex }}
regular7={{ term7.hex }}
bright0={{ term8.hex }}
bright1={{ term9.hex }}
bright2={{ term10.hex }}
bright3={{ term11.hex }}
bright4={{ term12.hex }}
bright5={{ term13.hex }}
bright6={{ term14.hex }}
bright7={{ term15.hex }}
selection-foreground={{ surface.hex }}
selection-background={{ term12.hex }}
