# Custom user configurations for Hyprland

# Window rules for the shortcuts helper Gtk window
windowrule = float 1, match:class ^(shortcut-helper|shortcut_help.py)$
windowrule = center 1, match:class ^(shortcut-helper|shortcut_help.py)$
windowrule = size 700 520, match:class ^(shortcut-helper|shortcut_help.py)$
windowrule = pin 1, match:class ^(shortcut-helper|shortcut_help.py)$
windowrule = focus_on_activate 1, match:class ^(shortcut-helper|shortcut_help.py)$

# Keybind to open the shortcuts helper Gtk window (Super + /)
bind = Super, slash, exec, python3 ~/.config/hypr/scripts/shortcut_help.py

# Workspace khusus untuk GitHub Desktop (Special/Scratchpad)
windowrule = workspace special:github, match:class ^(GitHub Desktop|github-desktop)$

# Keybind Super + G: Toggle special workspace github
bind = Super, G, exec, ~/.config/hypr/scripts/toggle-special-app.sh github 'GitHub Desktop|github-desktop' github-desktop

# Wallpaper set keybinds (random from a specific folder, via awww + caelestia theming)
bind = Super+Alt, W, exec, ~/.config/hypr/scripts/wallpaper.sh -r /home/rayin/Pictures/Wallpapers/work-wallpapers
bind = Super+Alt, G, exec, ~/.config/hypr/scripts/wallpaper.sh -r /home/rayin/Pictures/Wallpapers/goon-wallpapers

# Dim AI coding CLI terminal windows
windowrule = opaque false, match:class ^(codex-cli|antigravity-cli|opencode-cli)$
windowrule = opacity 0.75 override, match:class ^(codex-cli|antigravity-cli|opencode-cli)$
windowrule = opaque false, match:class ^(foot)$, match:title ([cC]odex|[aA]ntigravity|[oO]pencode)
windowrule = opacity 0.75 override, match:class ^(foot)$, match:title ([cC]odex|[aA]ntigravity|[oO]pencode)

# Override shell restart to also relaunch
bindr = Ctrl+Super+Shift, R, exec, caelestia shell -k; sleep .1; caelestia shell -d
