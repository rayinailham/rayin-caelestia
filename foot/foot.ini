[main]
font=JetBrainsMono Nerd Font:size=11,Noto Color Emoji:size=11
font-bold=JetBrainsMono Nerd Font:style=Bold:size=11,Noto Color Emoji:size=11
font-italic=JetBrainsMono Nerd Font:style=Italic:size=11,Noto Color Emoji:size=11
font-bold-italic=JetBrainsMono Nerd Font:style=Bold Italic:size=11,Noto Color Emoji:size=11
line-height=18px
letter-spacing=0
pad=18x16 center
initial-window-size-chars=100x30
resize-delay-ms=80
bold-text-in-bright=yes
selection-target=clipboard

[scrollback]
lines=20000
multiplier=5.0

[cursor]
style=beam
blink=yes
beam-thickness=1.6

[mouse]
hide-when-typing=yes

[url]
osc8-underline=url-mode

[colors-dark]
alpha=0.78
blur=yes
cursor=131317 c2c1ff
foreground=e5e1e7
background=131317
regular0=353434
regular1=ac73ff
regular2=44def5
regular3=ffdcf2
regular4=99aad8
regular5=b49fea
regular6=9dceff
regular7=e8d3de
bright0=ac9fa9
bright1=c093ff
bright2=89ecff
bright3=fff0f6
bright4=b5c1dd
bright5=c9b5f4
bright6=bae0ff
